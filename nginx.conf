# Nginx:发前端静态文件 + 反代后端 API
# 由 docker-compose 的 nginx 服务挂载到 /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    # gzip 压缩,减小前端资源传输体积
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端单页应用:静态文件 + 路由回退
    # 找不到文件就回退到 index.html,否则刷新 /workorder/xxx 这类前端路由会 404
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API:/api/xxx 去掉 /api 前缀转发到 app:8080/xxx
    # proxy_pass 末尾的 "/" 负责 strip 掉 /api,和联调时 vite 的 rewrite 一致
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent API:/agent-api/xxx 转发到 Python Agent 的 /api/xxx
    location /agent-api/ {
        proxy_pass http://agent:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    # 后端静态资源:用户头像在后端 /avatar/ 下,转给后端
    location /avatar/ {
        proxy_pass http://app:8080/avatar/;
    }
}
