# 容器环境配置(由 compose 用 SPRING_PROFILES_ACTIVE=docker 激活)
# 与 application-local.yml 的区别:
#   - 数据库/Redis 主机用 compose 服务名 mysql / redis(不是 localhost)
#   - 密码、JWT 密钥都走环境变量,不写死、不进 git
spring:
  application:
    name: work-order-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/work_order_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0
  ai:
    openai:
      base-url: ${AI_BASE_URL}                 # chat 走的 OpenAI 兼容端点(公共层,speech 等未用模块也靠它兜底)
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_CHAT_MODEL}
          temperature: 0.1
      embedding:                               # embedding 单独指向 SiliconFlow bge-m3
        base-url: https://api.siliconflow.cn
        api-key: ${AI_EMBEDDING_API_KEY}
        options:
          model: BAAI/bge-m3
    vectorstore:
      qdrant:
        host: qdrant                           # compose 服务名
        port: 6334                             # gRPC 口
        use-tls: false

logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS

jwt:
  secret: ${JWT_SECRET}
  ttl: 604800000
