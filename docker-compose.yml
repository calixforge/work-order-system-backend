# 工单系统一键编排:app + mysql + redis + qdrant
# 用法:在本文件同目录放好 Dockerfile / app.jar / sql/ / .env 后,执行 docker compose up -d
# 密码等敏感值从同目录 .env 读取(.env 不提交)

services:
  mysql:
    image: mysql:8.0
    container_name: wos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}   # root 密码,app 以 root 连
      MYSQL_DATABASE: work_order_system        # 首次启动自动建这个库
      TZ: Asia/Shanghai
    command: --default-time-zone=+08:00
    ports:
      - "3306:3306"                            # 映射到宿主,方便用 Navicat 等连着调试(可删)
    volumes:
      - mysql-data:/var/lib/mysql              # 数据持久化,容器删了数据还在
      # 首次启动按文件名顺序执行:先建表(01)再插数据(02)
      - ./sql/work_order_system.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/init_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:                               # app 要等 MySQL 真正就绪
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: wos-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]  # 设访问密码
    ports:
      - "6379:6379"                            # 调试用,可删

  qdrant:
    image: qdrant/qdrant                       # 拉不动时加 daocloud 等镜像前缀
    container_name: wos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"                            # HTTP:浏览器开 /dashboard 看数据(调试用)
      - "6334:6334"                            # gRPC:应用连这个口
    volumes:
      - qdrant-data:/qdrant/storage            # 向量数据持久化
    healthcheck:                               # app 要等 Qdrant HTTP 服务就绪后再初始化向量库
      test: ["CMD-SHELL", "(curl -fsS http://localhost:6333/healthz || wget -qO- http://localhost:6333/healthz) >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .                                   # 用同目录 Dockerfile 构建
    container_name: wos-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy             # 等 MySQL 健康检查通过再启动
      qdrant:
        condition: service_healthy             # 等 Qdrant ready 后再创建 collection / 导入知识库
    environment:
      SPRING_PROFILES_ACTIVE: docker           # 激活 application-docker.yml
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_BASE_URL: ${AI_BASE_URL}              # chat 模型的 OpenAI 兼容端点
      AI_API_KEY: ${AI_API_KEY}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY}   # SiliconFlow(bge-m3)
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: wos-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"                                # 全栈入口:浏览器从 80 端口进
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # nginx 配置
      - ./nginx/dist:/usr/share/nginx/html:ro                  # 前端 pnpm build 出的 dist

volumes:
  mysql-data:
  qdrant-data:
